<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Djurbyggaren VR – stora rummet</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b16;font-family:Arial,sans-serif}
#overlay{position:fixed;z-index:20;left:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:11px 17px;font-weight:900;color:#fff;background:linear-gradient(135deg,#7059ff,#a44cff);box-shadow:0 8px 24px #0009;cursor:pointer}
button.alt{background:linear-gradient(135deg,#08a9c8,#24d0a6)}
#joinOverlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#020713f2;color:white}
#joinCard{width:min(470px,90vw);padding:25px;border-radius:24px;background:#0a1830;border:1px solid #52e7ff66;box-shadow:0 25px 90px #000}
#joinCard h1{margin:0 0 7px;font-size:28px}
#joinCard p{color:#bdcce0;line-height:1.45}
#joinCard input{box-sizing:border-box;width:100%;padding:13px 15px;margin:6px 0;border-radius:12px;border:1px solid #63e6ff66;background:#061121;color:#fff;font-size:17px;text-transform:uppercase}
#joinCard button{width:100%;margin-top:10px}
#multiStatus{position:fixed;right:12px;top:12px;z-index:90;min-width:225px;padding:11px 14px;border-radius:14px;background:#061222e8;border:1px solid #5ee7ff55;color:white;font-weight:800;line-height:1.45}
#multiStatus small{display:block;color:#75eaff;font-weight:700}
#tip{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#06101ee8;color:#fff;font-weight:800;text-align:center;max-width:92vw}
</style>
</head>
<body>
<div id="joinOverlay">
  <div id="joinCard">
    <h1>Djurbyggaren Multiplayer</h1>
    <p>Öppna samma adress i båda headseten. Ange olika namn men samma rumskod. Den som lägger sista korrekta bokstaven får poängen.</p>
    <input id="playerName" maxlength="12" value="SPELARE">
    <input id="roomCode" maxlength="12" value="DJUR123">
    <button id="joinButton">ANSLUT TILL RUM</button>
  </div>
</div>
<div id="multiStatus">
  <small id="connectionText">Inte ansluten</small>
  <div id="scoreText">Väntar på spelare…</div>
</div>
<div id="overlay">
  <button id="enterVr">STARTA VR</button>
  <button id="resetBtn" class="alt">NYTT SPEL</button>
</div>
<div id="tip">Dator: WASD + mus. VR: håll båda GREPP för hopp. Använd endast TRIGGER för att ta och släppa kuber.</div>

<a-scene id="scene" floating-cube-physics
 renderer="antialias:true;colorManagement:true;physicallyCorrectLights:true"
 background="color:#050b16"
 xr-mode-ui="enabled:false"
 webxr="optionalFeatures:local-floor,bounded-floor"
 raycaster="objects:.interactable;far:2.1">

 <a-entity light="type:ambient;color:#d8e7ff;intensity:.7"></a-entity>
 <a-entity light="type:directional;color:#ffffff;intensity:1.05;castShadow:true" position="-6 10 4"></a-entity>
 <a-entity light="type:point;color:#46e5ff;intensity:2.4;distance:24" position="0 4 0"></a-entity>
 <a-entity light="type:point;color:#a667ff;intensity:2;distance:22" position="8 3 -8"></a-entity>
 <a-entity light="type:point;color:#ff5caa;intensity:1.5;distance:20" position="-8 3 7"></a-entity>

 <!-- 30 x 30 meter room -->
 <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40"
   material="color:#0d1d34;roughness:.78;metalness:.12" shadow="receive:true"></a-plane>
 <a-plane position="0 10 -20" width="40" height="20" material="color:#09162a;roughness:.9"></a-plane>
 <a-plane position="0 10 20" rotation="0 180 0" width="40" height="20" material="color:#09162a;roughness:.9"></a-plane>
 <a-plane position="-20 10 0" rotation="0 90 0" width="40" height="20" material="color:#0a1930;roughness:.9"></a-plane>

 <a-plane position="0 20 0" rotation="90 0 0" width="40" height="40" material="color:#081426;roughness:.92;metalness:.08;side:double"></a-plane>

 <!-- Shared wall with a large doorway -->
 <a-box position="20 10 -11.5" width=".25" height="20" depth="17"
   material="color:#0b1b2f;roughness:.88;metalness:.12"></a-box>
 <a-box position="20 10 11.5" width=".25" height="20" depth="17"
   material="color:#0b1b2f;roughness:.88;metalness:.12"></a-box>
 <a-box position="20 13.5 0" width=".25" height="13" depth="6"
   material="color:#0b1b2f;roughness:.88;metalness:.12"></a-box>

 <!-- Nature room, centered at x=42 -->
 <a-plane position="42 0 0" rotation="-90 0 0" width="40" height="40"
   material="color:#18351f;roughness:.92;metalness:.02" shadow="receive:true"></a-plane>
 <a-plane position="42 10 -20" width="40" height="20"
   material="color:#173122;roughness:.95"></a-plane>
 <a-plane position="42 10 20" rotation="0 180 0" width="40" height="20"
   material="color:#173122;roughness:.95"></a-plane>
 <a-plane position="62 10 0" rotation="0 -90 0" width="40" height="20"
   material="color:#142c1d;roughness:.95"></a-plane>
 <a-plane position="42 20 0" rotation="90 0 0" width="40" height="40"
   material="color:#10283b;roughness:.95;side:double"></a-plane>

 <a-entity light="type:point;color:#8dff9d;intensity:2.1;distance:28" position="42 7 0"></a-entity>
 <a-entity light="type:point;color:#ffe08b;intensity:1.3;distance:22" position="50 5 -9"></a-entity>

 <a-ring position="0 .012 0" rotation="-90 0 0" radius-inner="3.4" radius-outer="3.46"
   material="color:#42e7ff;emissive:#42e7ff;emissiveIntensity:2"></a-ring>
 <a-ring position="0 .013 0" rotation="-90 0 0" radius-inner="8.5" radius-outer="8.57"
   material="color:#9c67ff;emissive:#9c67ff;emissiveIntensity:1.5"></a-ring>
 <a-ring position="0 .014 0" rotation="-90 0 0" radius-inner="13" radius-outer="13.06"
   material="color:#ff5ba6;emissive:#ff5ba6;emissiveIntensity:1.1"></a-ring>

 <a-entity id="game"></a-entity>

 <a-entity id="rig" position="0 0 14.5" cube-watchdog xr-button-poller locomotion="speed:5.8;bounds:18.5">
   <a-camera id="camera" position="0 1.65 0" look-controls="pointerLockEnabled:false" wasd-controls="acceleration:40">
     <a-cursor fuse="false" raycaster="objects:.interactable;far:2.1"
       geometry="primitive:ring;radiusInner:.004;radiusOuter:.009"
       material="shader:flat;color:#fff"></a-cursor>
   </a-camera>
   <a-entity id="left" laser-controls="hand:left"
     raycaster="objects:.interactable;far:2.1" line="color:#52e7ff;opacity:.9;lineWidth:2"
     grabber></a-entity>
   <a-entity id="right" laser-controls="hand:right"
     raycaster="objects:.interactable;far:2.1" line="color:#d774ff;opacity:.95;lineWidth:2"
     grabber></a-entity>
 </a-entity>
</a-scene>

<script>
const ANIMAL_WORDS=[
  {sv:'GRÄVLING',en:'BADGER'},
  {sv:'IGELKOTT',en:'HEDGEHOG'},
  {sv:'UTTER',en:'OTTER'},
  {sv:'LO',en:'LYNX'},
  {sv:'VILDSVIN',en:'WILDBOAR'},
  {sv:'BÄVER',en:'BEAVER'},
  {sv:'TVÄTTBJÖRN',en:'RACCOON'},
  {sv:'EKORRE',en:'SQUIRREL'},
  {sv:'MÅRD',en:'MARTEN'},
  {sv:'JÄRV',en:'WOLVERINE'}
];
const NATURE_WORDS=[
  {sv:'BLÄCKFISK',en:'OCTOPUS'},
  {sv:'MANET',en:'JELLYFISH'},
  {sv:'SJÖHÄST',en:'SEAHORSE'},
  {sv:'ROCKA',en:'STINGRAY'},
  {sv:'DELFIN',en:'DOLPHIN'},
  {sv:'HAJ',en:'SHARK'},
  {sv:'VALROSS',en:'WALRUS'},
  {sv:'SJÖLEJON',en:'SEALION'},
  {sv:'HAVSSKÖLDPADDA',en:'SEATURTLE'},
  {sv:'SÄL',en:'SEAL'}
];
const WORDS=[...ANIMAL_WORDS,...NATURE_WORDS];
const ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ';
const COLORS=['#50ddff','#a66cff','#ff5ca5','#43d6a1','#ffd057','#4c84ff'];
const scene=document.getElementById('scene');
const game=document.getElementById('game');
let state;
let audioCtx=null;
const multiplayer={
  socket:null,connected:false,playerId:'',playerName:'SPELARE',room:'DJUR123',
  scores:{},players:{},avatars:{},applying:false,reconnectTimer:null,intentionalClose:false,lastPoseAt:0,lastPoseSignature:'',hudDirty:true,lastHudRefresh:0
};


function cleanCode(value,fallback){
  return (String(value||fallback).toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,12)||fallback);
}
function renderMultiplayerStatus(){
  multiplayer.hudDirty=true;
  const status=document.getElementById('connectionText');
  const score=document.getElementById('scoreText');
  if(status)status.textContent=multiplayer.connected
    ?`Rum ${multiplayer.room} • ${Object.keys(multiplayer.players).length} spelare`
    :'Inte ansluten';
  if(score){
    const rows=Object.entries(multiplayer.scores)
      .map(([id,v])=>({id,name:(multiplayer.players[id]&&multiplayer.players[id].name)||v.name||'SPELARE',score:Number(v.score)||0}))
      .sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
    score.innerHTML=rows.length?rows.map((r,i)=>`${i+1}. ${r.name}: ${r.score}`).join('<br>'):'Väntar på spelare…';
  }
}
function socketUrl(){
  const protocol=location.protocol==='https:'?'wss:':'ws:';
  return `${protocol}//${location.host}/ws/${encodeURIComponent(multiplayer.room)}?name=${encodeURIComponent(multiplayer.playerName)}`;
}
function connectMultiplayer(){
  if(multiplayer.socket){multiplayer.intentionalClose=true;try{multiplayer.socket.close()}catch(e){}}
  multiplayer.intentionalClose=false;
  const ws=new WebSocket(socketUrl());
  multiplayer.socket=ws;
  document.getElementById('connectionText').textContent='Ansluter…';
  ws.addEventListener('open',()=>{multiplayer.connected=true;document.getElementById('joinOverlay').style.display='none';renderMultiplayerStatus();sendGameState('join');});
  ws.addEventListener('message',event=>{try{handleServerMessage(JSON.parse(event.data));}catch(error){console.error(error);}});
  ws.addEventListener('close',()=>{multiplayer.connected=false;renderMultiplayerStatus();if(!multiplayer.intentionalClose){clearTimeout(multiplayer.reconnectTimer);multiplayer.reconnectTimer=setTimeout(connectMultiplayer,1800);}});
}
function currentNetworkState(){
  return {
    slots:state.slots.map(slot=>({wordkey:slot.dataset.wordkey,index:Number(slot.dataset.index),filled:slot.dataset.filled==='true',locked:slot.dataset.locked==='true',cube:slot.dataset.cube||''})),
    complete:[...state.complete]
  };
}
function sendMessage(message){
  if(multiplayer.connected&&multiplayer.socket&&multiplayer.socket.readyState===WebSocket.OPEN){
    multiplayer.socket.send(JSON.stringify(message));
  }
}
function sendGameState(reason='update'){
  if(!multiplayer.applying)sendMessage({type:'state',reason,state:currentNetworkState()});
}
function handleServerMessage(message){
  if(message.type==='welcome'){
    multiplayer.playerId=message.playerId;multiplayer.players=message.players||{};multiplayer.scores=message.scores||{};removeMissingAvatars();
    renderMultiplayerStatus();if(message.state)applyAuthoritativeState(message.state);return;
  }
  if(message.type==='presence'){multiplayer.players=message.players||{};multiplayer.scores=message.scores||multiplayer.scores;removeMissingAvatars();renderMultiplayerStatus();return;}
  if(message.type==='pose'){updateRemoteAvatar(message.playerId,(multiplayer.players[message.playerId]||{}).name,message.pose);return;}
  if(message.type==='state'){
    multiplayer.players=message.players||multiplayer.players;multiplayer.scores=message.scores||multiplayer.scores;removeMissingAvatars();renderMultiplayerStatus();applyAuthoritativeState(message.state);return;
  }
  if(message.type==='reset'){
    multiplayer.scores=message.scores||{};reset();renderMultiplayerStatus();
  }
}
function applyAuthoritativeState(remoteState){
  if(!remoteState||!state)return;
  multiplayer.applying=true;
  try{
    state.slots.forEach(slot=>{
      if(slot.dataset.filled==='true'){
        const cube=cubeById(slot.dataset.cube);
        if(cube&&cube!==state.held){game.object3D.attach(cube.object3D);cube.object3D.scale.set(1,1,1);setCubeState(cube,'loose');syncTransform(cube);}
      }
      slot.dataset.filled='false';slot.dataset.locked='false';delete slot.dataset.cube;setSlotVisual(slot,'incomplete');
    });
    (remoteState.slots||[]).forEach(item=>{
      if(!item.filled)return;
      const slot=state.slots.find(s=>s.dataset.wordkey===item.wordkey&&Number(s.dataset.index)===Number(item.index));
      const cube=cubeById(item.cube);
      if(!slot||!cube||cube===state.held)return;
      slot.dataset.filled='true';slot.dataset.locked=item.locked?'true':'false';slot.dataset.cube=item.cube;
      setCubeState(cube,'placed');game.object3D.attach(cube.object3D);
      const wp=worldPos(slot),lp=game.object3D.worldToLocal(wp.clone());
      const sq=slot.object3D.getWorldQuaternion(new THREE.Quaternion());
      const pq=game.object3D.getWorldQuaternion(new THREE.Quaternion());
      cube.object3D.position.copy(lp);cube.object3D.quaternion.copy(pq.invert().multiply(sq));cube.object3D.scale.set(.88,.88,.55);syncTransform(cube);
    });
    state.complete=new Set(remoteState.complete||[]);
    state.slots.forEach(slot=>{
      if(slot.dataset.filled!=='true')setSlotVisual(slot,'incomplete');
      else setSlotVisual(slot,slot.dataset.locked==='true'?'correct':'wrong');
    });
    updateStatus();
  }finally{multiplayer.applying=false;}
}


function vecToArray(v){return [Number(v.x.toFixed(3)),Number(v.y.toFixed(3)),Number(v.z.toFixed(3))];}
function quatToArray(q){return [Number(q.x.toFixed(4)),Number(q.y.toFixed(4)),Number(q.z.toFixed(4)),Number(q.w.toFixed(4))];}
function sendPose(){
  if(!multiplayer.connected||!state)return;
  const now=performance.now();if(now-multiplayer.lastPoseAt<170)return;
  const camera=document.getElementById('camera'),left=document.getElementById('left'),right=document.getElementById('right');
  if(!camera||!left||!right)return;
  const hp=new THREE.Vector3(),hq=new THREE.Quaternion(),lp=new THREE.Vector3(),lq=new THREE.Quaternion(),rp=new THREE.Vector3(),rq=new THREE.Quaternion();
  camera.object3D.getWorldPosition(hp);camera.object3D.getWorldQuaternion(hq);left.object3D.getWorldPosition(lp);left.object3D.getWorldQuaternion(lq);right.object3D.getWorldPosition(rp);right.object3D.getWorldQuaternion(rq);
  let heldLetter='',heldHand='';
  if(state.held){heldLetter=state.held.dataset.letter||'';heldHand=state.heldBy&&state.heldBy.id?state.heldBy.id:'';}
  const pose={head:vecToArray(hp),headQ:quatToArray(hq),left:vecToArray(lp),leftQ:quatToArray(lq),right:vecToArray(rp),rightQ:quatToArray(rq),heldLetter,heldHand};
  const signature=JSON.stringify(pose);
  if(signature===multiplayer.lastPoseSignature&&now-multiplayer.lastPoseAt<900)return;
  multiplayer.lastPoseAt=now;multiplayer.lastPoseSignature=signature;
  sendMessage({type:'pose',pose});
}
function avatarColor(id){let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];}
function avatarPart(tag,attrs,material){
  const el=document.createElement(tag);
  for(const [key,value] of Object.entries(attrs||{}))el.setAttribute(key,value);
  if(material)el.setAttribute('material',material);
  return el;
}
function createRemoteAvatar(id,name){
  if(multiplayer.avatars[id])return multiplayer.avatars[id];
  const root=document.createElement('a-entity');root.id=`avatar-${id}`;
  const color=avatarColor(id),dark='#102033';
  const glow=`color:${color};emissive:${color};emissiveIntensity:.34;roughness:.38;metalness:.12`;

  const head=avatarPart('a-sphere',{radius:'.245'},glow);root.appendChild(head);
  const visor=avatarPart('a-sphere',{radius:'.19',position:'0 .015 -.145',scale:'1 .58 .22'},'color:#dffaff;emissive:#7cecff;emissiveIntensity:.48;metalness:.55;roughness:.18');root.appendChild(visor);
  const neck=avatarPart('a-cylinder',{radius:'.105',height:'.14',position:'0 -.29 0'},glow);root.appendChild(neck);
  const body=avatarPart('a-cylinder',{radius:'.26',height:'.72',position:'0 -.68 0'},glow);root.appendChild(body);
  const chest=avatarPart('a-box',{width:'.38',height:'.18',depth:'.29',position:'0 -.53 -.07'},`color:${dark};emissive:${color};emissiveIntensity:.18;roughness:.45`);root.appendChild(chest);
  const hips=avatarPart('a-sphere',{radius:'.22',position:'0 -1.05 0',scale:'1 .62 .75'},glow);root.appendChild(hips);
  const legL=avatarPart('a-cylinder',{radius:'.075',height:'.55',position:'-.12 -1.38 0'},glow);root.appendChild(legL);
  const legR=avatarPart('a-cylinder',{radius:'.075',height:'.55',position:'.12 -1.38 0'},glow);root.appendChild(legR);
  const footL=avatarPart('a-box',{width:'.18',height:'.10',depth:'.30',position:'-.12 -1.68 -.08'},glow);root.appendChild(footL);
  const footR=avatarPart('a-box',{width:'.18',height:'.10',depth:'.30',position:'.12 -1.68 -.08'},glow);root.appendChild(footR);

  const badge=planeLabel(name||'SPELARE',[0,.48,0],1.9,.36,'rgba(3,12,25,.94)',color,124);root.appendChild(badge);
  const left=avatarPart('a-sphere',{radius:'.125'},glow);game.appendChild(left);
  const right=avatarPart('a-sphere',{radius:'.125'},glow);game.appendChild(right);
  const ringL=avatarPart('a-torus',{radius:'.16','radius-tubular':'.018',rotation:'90 0 0'},`color:${color};emissive:${color};emissiveIntensity:1.1;shader:flat`);left.appendChild(ringL);
  const ringR=avatarPart('a-torus',{radius:'.16','radius-tubular':'.018',rotation:'90 0 0'},`color:${color};emissive:${color};emissiveIntensity:1.1;shader:flat`);right.appendChild(ringR);
  const letter=avatarPart('a-box',{width:'.42',height:'.42',depth:'.42',visible:'false'},`color:${color};emissive:${color};emissiveIntensity:.25;roughness:.4`);game.appendChild(letter);
  game.appendChild(root);
  const avatar={root,head,left,right,letter,name,color,targetHead:new THREE.Vector3(),targetLeft:new THREE.Vector3(),targetRight:new THREE.Vector3()};
  multiplayer.avatars[id]=avatar;return avatar;
}
function updateRemoteAvatar(id,name,pose){
  if(id===multiplayer.playerId||!pose)return;
  const a=createRemoteAvatar(id,name);
  const smooth=(el,p,q)=>{
    if(p){el.object3D.position.lerp(new THREE.Vector3().fromArray(p),.58);}
    if(q){el.object3D.quaternion.slerp(new THREE.Quaternion().fromArray(q),.58);}
  };
  smooth(a.root,pose.head,pose.headQ);smooth(a.left,pose.left,pose.leftQ);smooth(a.right,pose.right,pose.rightQ);
  if(pose.heldLetter){
    const hand=pose.heldHand==='left'?a.left:a.right;
    a.letter.setAttribute('visible','true');a.letter.object3D.position.copy(hand.object3D.position);a.letter.object3D.quaternion.copy(hand.object3D.quaternion);a.letter.object3D.position.y-=.02;
    if(a.letter.dataset.letter!==pose.heldLetter){a.letter.dataset.letter=pose.heldLetter;addCubeFaces(a.letter,pose.heldLetter);}
  }else a.letter.setAttribute('visible','false');
}
function removeMissingAvatars(){
  for(const [id,a] of Object.entries(multiplayer.avatars))if(!multiplayer.players[id]){a.root.remove();a.left.remove();a.right.remove();a.letter.remove();delete multiplayer.avatars[id];}
}
setInterval(sendPose,180);

function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq=440,dur=.09,type='sine',gain=.04,delay=0){
  const a=audio(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+delay);
  g.gain.setValueAtTime(.0001,a.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(gain,a.currentTime+delay+.008);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+dur);
  o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+.03);
}
function sfx(kind){
  if(kind==='grab'){tone(330,.07,'triangle');tone(500,.08,'sine',.025,.035)}
  if(kind==='place'){tone(520,.08);tone(720,.12,'triangle',.04,.05)}
  if(kind==='wrong'){tone(125,.18,'sawtooth',.022)}
  if(kind==='word')[440,554,659,880].forEach((f,i)=>tone(f,.18,'triangle',.045,i*.08));
  if(kind==='win')[392,494,587,784,988].forEach((f,i)=>tone(f,.32,'sine',.055,i*.11));
}

function makeCanvas(text,bg='#ffffff',fg='#142744',w=512,h=512,fontPx=300,sub=''){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.clearRect(0,0,w,h);
  x.fillStyle=bg;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=Math.max(4,w*.012);x.strokeRect(8,8,w-16,h-16);
  x.textAlign='center';x.textBaseline='middle';
  const family='"Arial Rounded MT Bold","Trebuchet MS",Verdana,Arial,sans-serif';
  const fit=(value,maxPx,maxWidth)=>{
    let px=maxPx;
    do{x.font=`900 ${px}px ${family}`;if(x.measureText(value).width<=maxWidth)break;px-=4;}while(px>24);
    return px;
  };
  const mainY=sub?h*.40:h*.52;
  const mainPx=fit(String(text),fontPx,w*.86);
  x.font=`900 ${mainPx}px ${family}`;
  x.lineJoin='round';x.lineWidth=Math.max(2,mainPx*.035);x.strokeStyle='rgba(0,0,0,.18)';
  x.strokeText(String(text),w/2,mainY);x.fillStyle=fg;x.fillText(String(text),w/2,mainY);
  if(sub){
    const subPx=fit(String(sub),Math.round(h*.14),w*.86);
    x.font=`800 ${subPx}px ${family}`;x.fillStyle='#7890ac';x.fillText(String(sub),w/2,h*.77);
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}
function applyTexture(el,tex){
  const go=()=>{
    const mesh=el.getObject3D('mesh');

function roomSeed(text){
  let h=2166136261;

  }

}
function seededShuffle(items,seedText){
  const a=[...items]; let seed=roomSeed(seedText);
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}

function refreshRoomHuds(force=false){
  if(!state||!state.hudPlanes)return;
  const now=performance.now();
  if(!force&&!multiplayer.hudDirty&&now-multiplayer.lastHudRefresh<1000)return;
  if(!force&&now-multiplayer.lastHudRefresh<750)return;
  multiplayer.lastHudRefresh=now;multiplayer.hudDirty=false;
  const texture=makeHudTexture();
  state.hudPlanes.forEach(plane=>{
    const mesh=plane.getObject3D('mesh');
    if(mesh&&mesh.material){
      const old=mesh.material.map;
      mesh.material.map=texture;mesh.material.needsUpdate=true;
      if(old&&old!==texture)old.dispose();
    }else applyTexture(plane,texture);
  });

function updateStatus(){
  if(!state)return;
  const now=performance.now();
  const rigEl=document.getElementById('rig');
  const rig=rigEl?rigEl.object3D:null;

  if(rig){
    if(!state.lastPlayerPos){
      state.lastPlayerPos=rig.position.clone();
      state.lastSpeedTime=now;
      state.lastMeasuredSpeed=0;
    }else{
      const elapsed=Math.max(.001,(now-state.lastSpeedTime)/1000);
      const delta=rig.position.clone().sub(state.lastPlayerPos);
      const horizontal=Math.hypot(delta.x,delta.z)/elapsed;
      state.lastMeasuredSpeed=Math.sqrt(horizontal*horizontal+(state.verticalVelocity||0)**2);
      state.lastPlayerPos.copy(rig.position);
      state.lastSpeedTime=now;
    }
  }

  refreshRoomHuds();

  const loose=state.cubes.filter(c=>c.dataset.used==='loose'||c.dataset.used==='held').length;
  if(!state.gameOver)document.getElementById('tip').textContent=
    `${state.complete.size}/20 klara • ${loose} bokstavskuber • rätt bokstav sparas, blir grön och låses`;
}

function pickupPlacedCube(slot,holder){
  if(!slot||slot.dataset.filled!=='true'||slot.dataset.locked==='true'||state.held)return false;
  const cube=cubeById(slot.dataset.cube);
  if(!cube)return false;

  // Free the slot first and reset the whole word visual.
  slot.dataset.filled='false';
  delete slot.dataset.cube;
  setWordVisual(slot.dataset.wordkey,'incomplete');

  // Put cube back into the world with a clean transform/state.
  game.object3D.attach(cube.object3D);
  cube.object3D.scale.set(1,1,1);
  cube.object3D.rotation.set(0,0,0);
  syncTransform(cube);
  setCubeState(cube,'loose');

  if(holder==='desktop'){
    state.held=cube;
    state.heldBy='desktop';
    setCubeState(cube,'held');
    cube.object3D.scale.set(1.24,1.24,1.24);
    syncTransform(cube);
    sfx('grab');
  }else{
    // Manually attach so retrieval works even though the cube was just "placed".
    state.held=cube;
    state.heldBy=holder;
    setCubeState(cube,'held');
    holder.object3D.attach(cube.object3D);
    cube.object3D.position.set(0,-.025,-.16);
    cube.object3D.rotation.set(0,0,0);
    cube.object3D.scale.set(1.02,1.02,1.02);
    syncTransform(cube);
    sfx('grab');
  }

  updateStatus();
  sendGameState('remove');
  return true;
}

let jetNoise=null;
function startJetSound(){
  if(jetNoise||state.gameOver)return;
  const a=audio();
  const buffer=a.createBuffer(1,a.sampleRate*2,a.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const source=a.createBufferSource();source.buffer=buffer;source.loop=true;
  const filter=a.createBiquadFilter();filter.type='bandpass';filter.frequency.value=900;filter.Q.value=.75;
  const gain=a.createGain();gain.gain.value=.0001;
  source.connect(filter).connect(gain).connect(a.destination);
  gain.gain.exponentialRampToValueAtTime(.05,a.currentTime+.08);
  source.start();
  jetNoise={source,gain};
}
function stopJetSound(){
  if(!jetNoise)return;
  const current=jetNoise;
  const a=audio();
  current.gain.gain.cancelScheduledValues(a.currentTime);
  current.gain.gain.setValueAtTime(Math.max(.0001,current.gain.gain.value),a.currentTime);
  current.gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.10);
  setTimeout(()=>{try{current.source.stop()}catch(e){}},130);
  jetNoise=null;
}

function shootBall(hand){
  if(!state||state.gameOver)return;

  const rayComp=hand.components?.raycaster;
  if(!rayComp||!rayComp.raycaster)return;

  const ray=rayComp.raycaster.ray;
  const origin=ray.origin.clone();
  const direction=ray.direction.clone().normalize();

  const ball=document.createElement('a-sphere');
  ball.setAttribute('radius','.075');
  ball.setAttribute('material',
    'color:#ffffff;emissive:#59e6ff;emissiveIntensity:3;shader:flat');
  game.appendChild(ball);

  // Spawn exactly on the visible pointer ray, slightly ahead of the controller.
  ball.object3D.position.copy(origin.clone().addScaledVector(direction,.28));
  state.projectiles.push({
    el:ball,
    velocity:direction.multiplyScalar(12.5),
    life:2.8
  });
  tone(980,.065,'square',.038);
}
function updateProjectiles(sec){
  if(!state||!state.projectiles||state.paused)return;
  for(let i=state.projectiles.length-1;i>=0;i--){
    const shot=state.projectiles[i];
    shot.life-=sec;
    shot.el.object3D.position.addScaledVector(shot.velocity,sec);

    let hit=false;
    for(const cube of state.cubes){
      if(cube.dataset.used!=='loose')continue;
      if(worldPos(shot.el).distanceTo(worldPos(cube))<.42){
        const phys=state.physics.get(cube);
        if(phys){
          const hitDirection=shot.velocity.clone().normalize();
          phys.velocity.add(hitDirection.multiplyScalar(4.0));
          phys.velocity.setLength(Math.min(5.0,Math.max(1.8,phys.velocity.length())));
          phys.angular.add(new THREE.Vector3(
            rand(-2.4,2.4),rand(-3.0,3.0),rand(-2.4,2.4)
          ));
        }
        tone(360,.065,'triangle',.035);
        hit=true;
        break;
      }
    }

    if(hit||shot.life<=0){
      shot.el.remove();
      state.projectiles.splice(i,1);
    }
  }
}

function stepZeroGPhysics(time,dtMs){
  if(!state||!state.physics||state.paused)return;
  const sec=Math.min(.04,Math.max(.001,(dtMs||16)/1000));
  const bodies=[...state.cubes,...state.hazards];
  const minX=-19.1,maxX=61.1,minY=.32,maxY=19.1,minZ=-19.1,maxZ=19.1;

  for(const body of bodies){
    const phys=state.physics.get(body);
    if(!phys)continue;
    if(!phys.hazard && body.dataset.used!=='loose')continue;

    const t=time*.00018;
    const wind=new THREE.Vector3(
      Math.sin(t+phys.phase)*.075+Math.cos(t*.67+phys.phase*1.7)*.035,
      Math.sin(t*.83+phys.phase*.8)*.025,
      Math.cos(t*.72+phys.phase*1.3)*.075+Math.sin(t*.51+phys.phase*.4)*.035
    ).multiplyScalar(phys.gust);

    phys.velocity.addScaledVector(wind,sec);
    phys.velocity.multiplyScalar(Math.pow(.994,sec*60));

    const minSpeed=phys.hazard?.58:.48;
    const maxSpeed=phys.hazard?1.65:1.4;
    const speed=phys.velocity.length();
    if(speed<minSpeed)phys.velocity.setLength(minSpeed);
    if(speed>maxSpeed)phys.velocity.setLength(maxSpeed);

    body.object3D.position.addScaledVector(phys.velocity,sec);
    body.object3D.rotation.x+=phys.angular.x*sec;
    body.object3D.rotation.y+=phys.angular.y*sec;
    body.object3D.rotation.z+=phys.angular.z*sec;

    const q=body.object3D.position;
    if(q.x<minX){q.x=minX;phys.velocity.x=Math.abs(phys.velocity.x)*.92}
    if(q.x>maxX){q.x=maxX;phys.velocity.x=-Math.abs(phys.velocity.x)*.92}
    if(q.y<minY){q.y=minY;phys.velocity.y=Math.abs(phys.velocity.y)*.90}
    if(q.y>maxY){q.y=maxY;phys.velocity.y=-Math.abs(phys.velocity.y)*.90}
    if(q.z<minZ){q.z=minZ;phys.velocity.z=Math.abs(phys.velocity.z)*.92}
    if(q.z>maxZ){q.z=maxZ;phys.velocity.z=-Math.abs(phys.velocity.z)*.92}

    // Shared wall at x=20. Bodies may pass only through the doorway.
    const inDoorway=Math.abs(q.z)<=3.0 && q.y<=7.0;
    if(!inDoorway && Math.abs(q.x-20)<.42){
      if(phys.velocity.x>0){q.x=19.55;phys.velocity.x=-Math.abs(phys.velocity.x)}
      else{q.x=20.45;phys.velocity.x=Math.abs(phys.velocity.x)}
    }
  }

  const radius=.36;
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i],pa=state.physics.get(a);
    if(!pa||(!pa.hazard&&a.dataset.used!=='loose'))continue;
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j],pb=state.physics.get(b);
      if(!pb||(!pb.hazard&&b.dataset.used!=='loose'))continue;
      const delta=b.object3D.position.clone().sub(a.object3D.position);
      const d=delta.length();
      if(d>0&&d<radius*2){
        const n=delta.multiplyScalar(1/d),overlap=radius*2-d;
        a.object3D.position.addScaledVector(n,-overlap*.5);
        b.object3D.position.addScaledVector(n, overlap*.5);
        const rel=pb.velocity.clone().sub(pa.velocity),sep=rel.dot(n);
        if(sep<0){
          const impulse=-sep*.8;
          pa.velocity.addScaledVector(n,-impulse);
          pb.velocity.addScaledVector(n, impulse);
        }
      }
    }
  }

  updateProjectiles(sec);
  checkHazardTouch();
}
let zeroGLast=performance.now();
function zeroGLoop(now){
  // Window RAF is paused or throttled when an immersive XR session owns rendering.
  // Use it only outside VR; the A-Frame component below drives physics inside XR.
  if(!scene.is('vr-mode')){
    stepZeroGPhysics(now,Math.min(50,now-zeroGLast));
  }
  zeroGLast=now;
  requestAnimationFrame(zeroGLoop);
}
requestAnimationFrame(zeroGLoop);

AFRAME.registerComponent('locomotion',{
 schema:{speed:{default:5.8},bounds:{default:14}},
 init(){

 tick(time,dt){

   const camera=document.getElementById('camera').object3D;

   const yaw=new THREE.Euler().setFromQuaternion(headQ,'YXZ').y;
   const invYaw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-yaw);

     const r=new THREE.Vector3(1,0,0).applyQuaternion(headQ);r.y=0;r.normalize();

// Attach them explicitly now so their tick loops always run.
scene.removeAttribute('floating-cube-physics');
scene.setAttribute('floating-cube-physics','');
const rigEntity=document.getElementById('rig');
rigEntity.removeAttribute('cube-watchdog');
rigEntity.setAttribute('cube-watchdog','');

document.getElementById('joinButton').onclick=()=>{
  multiplayer.playerName=cleanCode(document.getElementById('playerName').value,'SPELARE');
  multiplayer.room=cleanCode(document.getElementById('roomCode').value,'DJUR123');
  reset();connectMultiplayer();
};

document.getElementById('enterVr').onclick=()=>{
  zeroGLast=performance.now();
  try{
    const result=scene.enterVR();
    if(result&&typeof result.catch==='function'){
      result.catch(err=>{
        console.error('VR-start misslyckades',err);
        document.getElementById('tip').textContent='VR kunde inte startas — prova igen';
      });
    }
  }catch(err){
    console.error('VR-start misslyckades',err);
    document.getElementById('tip').textContent='VR kunde inte startas — prova igen';
  }
};
scene.addEventListener('enter-vr',()=>{zeroGLast=performance.now()});
scene.addEventListener('exit-vr',()=>{zeroGLast=performance.now();stopJetSound();state.jetpack=false;});
document.getElementById('resetBtn').onclick=()=>{
  if(multiplayer.connected)sendMessage({type:'reset'});else reset();
};

// Important: start whether A-Frame has already loaded or not.
if(scene.hasLoaded) reset();
else scene.addEventListener('loaded',reset,{once:true});
setInterval(()=>{if(state)updateStatus()},1000);
</script>
</body>
</html>
